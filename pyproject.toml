[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-call-bot"
version = "0.1.0"
description = "Android ADB based outbound call bot MVP"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "loguru>=0.7.2",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[tool.setuptools]
packages = ["autocallbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
